# Modern Accounting CE — Compose target (chat-api/client export post Dev 1b)
# Source of truth: docs/architecture/ce-seams.md (+ private same path)
# Out of CE Compose: agent-write profile, live QBO MCP, managed control-plane, ma-mcp (deferred).
#
# Usage:
#   cp .env.ce.example .env.ce   # then edit locally; never commit .env.ce
#   docker compose -f docker-compose.ce.yml --env-file .env.ce up
#   docker compose -f docker-compose.ce.yml --env-file .env.ce --profile app up --build
#
# See docs/self-host/ce-boot.md

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ma-ce-db
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-ChangeMe_CE_Dev_Password1}"
    ports:
      - "14330:1433"
    volumes:
      - ce-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -N -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    profiles: ["app"]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.db-init
    container_name: ma-ce-db-init
    environment:
      SQL_SERVER: database
      SQL_PORT: 1433
      SQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-ChangeMe_CE_Dev_Password1}
    depends_on:
      database:
        condition: service_healthy

  dab:
    profiles: ["app"]
    image: mcr.microsoft.com/azure-databases/data-api-builder:1.7.90
    container_name: ma-ce-dab
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    volumes:
      - ./dab-config.json:/App/dab-config.json
    environment:
      DAB_CONNECTION_STRING: Server=database,1433;Database=AccountingDB;User Id=sa;Password=${SQL_SA_PASSWORD:-ChangeMe_CE_Dev_Password1};TrustServerCertificate=true

  email-api:
    profiles: ["app"]
    build:
      context: ./email-api
      dockerfile: Dockerfile
    container_name: ma-ce-email-api
    depends_on:
      - database
    ports:
      - "7073:7073"
    environment:
      DATABASE_URL: Server=database,1433;Database=AccountingDB;User Id=sa;Password=${SQL_SA_PASSWORD:-ChangeMe_CE_Dev_Password1};TrustServerCertificate=true
      EMAIL_API_PORT: "7073"
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-change-me-ce-dev-only}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      DAB_API_URL: http://dab:5000/api
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

  csv-import-api:
    profiles: ["app"]
    build:
      context: ./csv-import-api
      dockerfile: Dockerfile
    container_name: ma-ce-csv-import-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "7072:7072"
    environment:
      CSV_IMPORT_PORT: "7072"
      DATABASE_URL: Server=database,1433;Database=AccountingDB;User Id=sa;Password=${SQL_SA_PASSWORD:-ChangeMe_CE_Dev_Password1};TrustServerCertificate=true
      # Optional BYO LLM for categorization — CE placeholders only
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}

  chat-api:
    profiles: ["app"]
    build:
      context: ./chat-api
      dockerfile: Dockerfile
    container_name: ma-ce-chat-api
    depends_on:
      db-init:
        condition: service_completed_successfully
      dab:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: development
      CE_BUILD: ${CE_BUILD:-true}
      BYPASS_AUTH: ${BYPASS_AUTH:-true}
      SQL_SERVER: database
      SQL_PORT: "1433"
      SQL_USER: sa
      SQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-ChangeMe_CE_Dev_Password1}
      SQL_DATABASE: AccountingDB
      DAB_API_URL: http://dab:5000/api
      DAB_URL: http://dab:5000
      DAB_REST_URL: http://dab:5000/api
      DAB_MCP_URL: http://dab:5000/mcp
      APP_URL: ${APP_BASE_URL:-http://localhost:5173}
      # Optional Milton BYO LLM
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      # Intentionally unset in CE: live QBO MCP, ma-mcp, agent GitHub write tokens, bank-link secrets

  client:
    profiles: ["app"]
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ma-ce-client
    depends_on:
      - chat-api
    ports:
      - "5173:5173"
    environment:
      # Browser calls published host ports (not Docker DNS names)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_CHAT_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_EMAIL_API_URL: ${VITE_EMAIL_API_URL:-http://localhost:7073}
      VITE_DAB_URL: ${VITE_DAB_URL:-http://localhost:5000}
      VITE_BYPASS_AUTH: ${VITE_BYPASS_AUTH:-true}
      VITE_CE_BUILD: ${VITE_CE_BUILD:-true}
      VITE_PORT: "5173"
    volumes:
      # vite.config reads monorepo root package.json for __APP_VERSION__
      - ./package.json:/package.json:ro

  # ma-mcp: deferred — Architect review before enable
  # live QBO MCP: out of CE
  # agent-write profile and enhancement agent service: out of CE

volumes:
  ce-sql-data:
