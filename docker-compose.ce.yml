# Modern Accounting CE — Compose target (Phase 1a / Slice A)
# Source of truth: docs/architecture/ce-seams.md (+ private same path)
# Phase 1b (HOLD) exports runtime trees; until then only `database` is runnable.
# Out of CE Compose: agent-write profile, live QBO MCP, managed control-plane.
#
# Usage (Phase 0/1a):
#   docker compose -f docker-compose.ce.yml up
# After Phase 1b tree export:
#   docker compose -f docker-compose.ce.yml --profile app up

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ma-ce-db
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-ChangeMe_CE_Dev_Password1}"
    ports:
      - "14330:1433"
    volumes:
      - ce-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -N -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

